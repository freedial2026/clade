# Local, disposable PostgreSQL for development only.
#
# Not a production deployment: credentials are fixed and non-secret by
# design (they are checked in), the port is published on localhost only,
# and the volume holds data that can always be rebuilt from the raw
# archives under `data/raw/` via `python -m boat_prediction.db.load_archive`.
#
#   docker compose up -d db
#   export DATABASE_URL=postgresql+psycopg2://boat:boat@localhost:5433/boat_prediction
#   alembic upgrade head
#
# Port 5433 rather than 5432 so this never collides with a Postgres the
# developer already runs locally.

services:
  db:
    image: postgres:17
    container_name: boat-prediction-db
    environment:
      POSTGRES_USER: boat
      POSTGRES_PASSWORD: boat
      POSTGRES_DB: boat_prediction
      # Deterministic collation so index/order behaviour matches across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - boat_prediction_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boat -d boat_prediction"]
      interval: 5s
      timeout: 5s
      retries: 20
    # ~7M race_entries rows get loaded in bulk; the defaults are tuned for
    # a much smaller container. These are local-only tuning knobs, not a
    # production configuration.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_wal_size=4GB

volumes:
  boat_prediction_pgdata:
